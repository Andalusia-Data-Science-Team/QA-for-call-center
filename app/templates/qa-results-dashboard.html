<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Call QA Results Dashboard</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: "Segoe UI", Tahoma, "Segoe UI Emoji", "Segoe UI Symbol", "Noto Color Emoji", "Apple Color Emoji", sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container { max-width: 1200px; margin: 0 auto; }

        /* ── Header ── */
        .header {
            background: white; padding: 30px; border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,.2);
            margin-bottom: 30px; text-align: center;
        }
        .header h1 { color: #2d3748; font-size: 2rem; margin-bottom: 10px; }
        .header p  { color: #718096; font-size: 1rem; }

        .header-nav-btn {
            display: inline-block; margin-top: 18px; padding: 10px 22px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white; text-decoration: none; border-radius: 25px;
            font-weight: 600; font-size: .95rem; transition: opacity .2s, transform .15s;
        }
        .header-nav-btn:hover { opacity: .9; transform: translateY(-2px); }

        /* ── Generic card ── */
        .card {
            background: white; padding: 25px; border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,.2); margin-bottom: 20px;
        }
        .card-header {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 20px; padding-bottom: 15px;
            border-bottom: 2px solid #e2e8f0; flex-wrap: wrap; gap: 10px;
        }
        .card-title { font-size: 1.5rem; color: #2d3748; font-weight: 600; }

        /* ── Filter form ── */
        .filter-form {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 16px; align-items: end;
        }
        .form-group { display: flex; flex-direction: column; gap: 6px; }
        .form-group label { color: #4a5568; font-weight: 600; font-size: .9rem; }
        .form-group select,
        .form-group input {
            padding: 11px 14px; border: 2px solid #e2e8f0; border-radius: 10px;
            font-size: 1rem; color: #2d3748; background: #f7fafc;
        }
        .form-group select:focus,
        .form-group input:focus { outline: none; border-color: #667eea; }

        .run-btn {
            padding: 12px 28px; border-radius: 10px; border: none;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white; font-weight: 700; font-size: 1rem;
            cursor: pointer; transition: opacity .2s, transform .15s;
            white-space: nowrap;
        }
        .run-btn:hover { opacity: .9; transform: translateY(-2px); }
        .clear-btn {
            padding: 12px 20px; border-radius: 10px; border: 2px solid #e2e8f0;
            background: #f7fafc; color: #4a5568; font-weight: 600; font-size: .95rem;
            cursor: pointer; transition: background .2s;
        }
        .clear-btn:hover { background: #edf2f7; }

        /* ── Status / error ── */
        .status-msg { margin-top: 14px; text-align: center; font-weight: 600; color: #667eea; display: none; }
        .error-msg  { margin-top: 14px; background: #fed7d7; color: #742a2a; padding: 10px 16px; border-radius: 8px; display: none; }
        .spinner {
            display: inline-block; width: 18px; height: 18px;
            border: 3px solid #d0d0ff; border-top-color: #667eea;
            border-radius: 50%; animation: spin .7s linear infinite;
            vertical-align: middle; margin-right: 8px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* ── Summary metrics ── */
        .performance-metrics {
            display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 20px; margin-bottom: 20px;
        }
        .metric-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 20px; border-radius: 10px; color: white; text-align: center;
        }
        .metric-label { font-size: .85rem; opacity: .9; margin-bottom: 10px; }
        .metric-value { font-size: 2.2rem; font-weight: bold; }

        /* ── Call records ── */
        .call-record {
            background: white; border: 2px solid #e2e8f0;
            border-radius: 10px; margin-bottom: 14px; overflow: hidden;
        }
        .call-record summary {
            cursor: pointer; list-style: none; padding: 14px 18px;
            display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 10px;
        }
        .call-record summary::-webkit-details-marker { display: none; }
        .call-record summary:hover { background: #f7fafc; }
        .call-record-id   { font-weight: 600; color: #2d3748; }
        .call-record-date { color: #718096; font-size: .85rem; margin-left: 8px; }
        .call-record-body { padding: 0 18px 18px; border-top: 1px solid #edf2f7; }

        .status-badge { padding: 6px 16px; border-radius: 25px; font-weight: 600; text-transform: uppercase; font-size: .78rem; letter-spacing: .5px; }
        .status-pass         { background: #c6f6d5; color: #22543d; }
        .status-needs_review { background: #fefcbf; color: #744210; }
        .status-escalate     { background: #fed7d7; color: #742a2a; }
        .status-error        { background: #e2e8f0; color: #4a5568; }

        .mini-scores { display: flex; gap: 18px; margin-top: 10px; flex-wrap: wrap; }
        .mini-score  { font-size: .85rem; color: #4a5568; }
        .mini-score b { color: #2d3748; }
        .empty-note  { color: #718096; text-align: center; padding: 24px; }

        .compliance-item { background: #fafafa; border: 2px solid #e2e8f0; padding: 13px; border-radius: 10px; margin-top: 12px; }
        .compliance-header { display: flex; gap: 8px; margin-bottom: 8px; flex-wrap: wrap; }
        .severity-badge { padding: 4px 11px; border-radius: 15px; font-size: .78rem; font-weight: 600; }
        .severity-critical { background: #fed7d7; color: #742a2a; }
        .severity-moderate { background: #fef5e7; color: #b7791f; }
        .severity-minor    { background: #fef9c3; color: #92400e; }
        .severity-positive { background: #d4edda; color: #155724; }
        .type-badge  { padding: 4px 11px; border-radius: 15px; font-size: .78rem; font-weight: 600; }
        .type-c2c    { background: #f3e5f5; color: #4a148c; }
        .type-c2b    { background: #e8f5e9; color: #1b5e20; }
        .type-c2com  { background: #fff3e0; color: #e65100; }
        .type-nc     { background: #e3f2fd; color: #0d47a1; }

        .excerpt-box {
            background: #f7fafc; padding: 10px; border-radius: 8px;
            margin-top: 8px; font-style: italic; color: #4a5568;
            border-left: 3px solid #cbd5e0; font-size: .9rem;
        }
    </style>
</head>
<body>
<div class="container">

    <div class="header">
        <h1>📋 Call QA Results Dashboard</h1>
        <p>Browse &amp; filter stored QA results from [DWH].[AI].[Call_QA_Results]</p>
        <a href="/qa-dashboard" class="header-nav-btn">👥 Agents QA Dashboard</a>
    </div>

    <!-- ── Filter form ── -->
    <div class="card">
        <div class="card-header"><h2 class="card-title">🔎 Filter Results</h2></div>

        <div class="filter-form">
            <div class="form-group">
                <label for="agentName">Agent Name</label>
                <input type="text" id="agentName" placeholder="e.g. Ahmed Ali" />
            </div>
            <div class="form-group">
                <label for="dateFrom">Call Date From</label>
                <input type="date" id="dateFrom" />
            </div>
            <div class="form-group">
                <label for="dateTo">Call Date To</label>
                <input type="date" id="dateTo" />
            </div>
            <div class="form-group">
                <label for="assessment">Overall Assessment</label>
                <select id="assessment">
                    <option value="">— all —</option>
                    <option value="pass">Pass</option>
                    <option value="needs_review">Needs Review</option>
                    <option value="escalate">Escalate</option>
                    <option value="error">Error</option>
                </select>
            </div>
            <div class="form-group">
                <label for="classification">Agent Classification</label>
                <select id="classification">
                    <option value="">— all —</option>
                    <option value="A">A</option>
                    <option value="B">B</option>
                    <option value="C">C</option>
                    <option value="D">D</option>
                </select>
            </div>
            <button class="run-btn" id="runBtn">▶ Apply Filters</button>
            <button class="clear-btn" id="clearBtn">✖ Clear</button>
        </div>

        <div class="status-msg" id="statusMsg"><span class="spinner"></span> <span id="statusText">Working…</span></div>
        <div class="error-msg"  id="errorMsg"></div>
    </div>

    <!-- ── Results ── -->
    <div id="resultsSection" style="display:none;">
        <div class="card">
            <div class="card-header"><h2 class="card-title">📊 Summary</h2></div>
            <div class="performance-metrics" id="summaryMetrics"></div>
        </div>
        <div class="card">
            <div class="card-header"><h2 class="card-title">📞 Call Records</h2></div>
            <div id="callRecordsList"></div>
        </div>
    </div>

</div>

<script>
const API_BASE = '';

/* ── helpers ── */
const $ = id => document.getElementById(id);
const pct = score => score == null ? '—' : Math.round(score * 100) + '%';
function esc(str) {
    return String(str ?? '')
        .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function statusClass(a) { return 'status-' + (a||'error').toLowerCase().replace(/\s+/g,'_'); }
function severityClass(s) { return 'severity-' + (s||'minor').toLowerCase(); }
function typeClass(t)     { return 'type-'     + (t||'nc').toLowerCase(); }

function showStatus(on, text='Working…') {
    $('statusMsg').style.display = on ? 'block' : 'none';
    $('statusText').textContent = text;
}
function showError(msg) {
    const el = $('errorMsg');
    el.style.display = msg ? 'block' : 'none';
    el.textContent   = msg || '';
}

/* ── fetch results with filters ── */
async function loadResults() {
    showError('');
    showStatus(true, 'Loading QA results…');

    const params = new URLSearchParams();
    const agentName = $('agentName').value.trim();
    const dateFrom  = $('dateFrom').value;
    const dateTo    = $('dateTo').value;
    const assessment     = $('assessment').value;
    const classification = $('classification').value;

    if (agentName)       params.set('agent_name', agentName);
    if (dateFrom)        params.set('date_from', dateFrom);
    if (dateTo)          params.set('date_to', dateTo);
    if (assessment)      params.set('overall_assessment', assessment);
    if (classification)  params.set('agent_classification', classification);

    try {
        const res = await fetch(`${API_BASE}/api/qa-results?${params.toString()}`);
        if (!res.ok) {
            const body = await res.json().catch(() => ({ detail: res.statusText }));
            throw new Error(body.detail || res.statusText);
        }
        const data = await res.json();
        renderResults(data);
    } catch (err) {
        showError('Error: ' + err.message);
        console.error('[loadResults]', err);
    } finally {
        showStatus(false);
    }
}

/* ── render results ── */
function renderResults(data) {
    const s = data.summary || {};
    $('summaryMetrics').innerHTML = `
        <div class="metric-card"><div class="metric-label">Total Records</div><div class="metric-value">${s.total ?? 0}</div></div>
        <div class="metric-card"><div class="metric-label">✅ Pass</div><div class="metric-value">${s.pass ?? 0}</div></div>
        <div class="metric-card"><div class="metric-label">🔍 Needs Review</div><div class="metric-value">${s.needs_review ?? 0}</div></div>
        <div class="metric-card"><div class="metric-label">🚨 Escalate</div><div class="metric-value">${s.escalate ?? 0}</div></div>
        <div class="metric-card"><div class="metric-label">⚠ Errors</div><div class="metric-value">${s.errors ?? 0}</div></div>
        <div class="metric-card"><div class="metric-label">📈 Avg Weighted Score</div><div class="metric-value">${s.avg_weighted_score ?? '—'}</div></div>
    `;

    const results = data.results || [];
    $('callRecordsList').innerHTML = results.length
        ? results.map((r, i) => callRecordHTML(r, i)).join('')
        : '<p class="empty-note">No records match the selected filters.</p>';

    $('resultsSection').style.display = 'block';
    $('resultsSection').scrollIntoView({ behavior: 'smooth' });
}

function callRecordHTML(r, idx) {
    const cls       = r.agent_classification || '';
    const clsColour = { A:'#22543d', B:'#744210', C:'#e65100', D:'#742a2a' }[cls] || '#2d3748';
    const clsBg     = { A:'#c6f6d5', B:'#fefcbf', C:'#feebc8', D:'#fed7d7' }[cls] || '#e2e8f0';

    const classificationBadge = cls
        ? `<span style="background:${clsBg};color:${clsColour};padding:3px 12px;border-radius:12px;font-weight:700;font-size:.85rem;">Class ${esc(cls)}</span>`
        : '';

    const profiling    = r.profiling_comment || '';
    const profilingRow = profiling
        ? `<div class="mini-score" style="margin-top:6px;">🏷 Profiling: <b>${esc(profiling)}</b></div>`
        : '';

    const flags = r.compliance_flags || [];

    const conversationLinkHTML = r.conversation_link
        ? `<a href="${esc(r.conversation_link)}" target="_blank" rel="noopener" style="color:#667eea;font-weight:700;text-decoration:none;">🔗 ${esc(r.conversation_link)}</a>`
        : '<span style="color:#a0aec0;font-style:italic;">No conversation link</span>';

    return `
    <details class="call-record" ${idx === 0 ? 'open' : ''}>
        <summary>
            <span style="display:flex;flex-direction:column;gap:3px;min-width:0;flex:1;">
                <span class="call-record-id">${esc(r.call_id || '—')}</span>
                <span>${conversationLinkHTML}</span>
                <span class="call-record-date">${esc(r.agent_name || '')} · ${esc(r.call_date || '')}</span>
            </span>
            <span style="display:flex; gap:8px; align-items:center;">
                ${classificationBadge}
                <span class="status-badge ${statusClass(r.overall_assessment)}">
                    ${esc((r.overall_assessment||'error').toUpperCase().replace(/_/g,' '))}
                </span>
            </span>
        </summary>
        <div class="call-record-body">
            <p style="color:#4a5568;line-height:1.6;margin-top:10px;">${esc(r.assessment_reasoning||'')}</p>

            <div class="mini-scores">
                <div class="mini-score">Professionalism: <b>${pct(r.professionalism_score)}</b></div>
                <div class="mini-score">Weighted: <b>${r.weighted_score ?? '—'}</b></div>
                <div class="mini-score">Department: <b>${esc(r.department || '—')}</b></div>
                <div class="mini-score">Duration: <b>${r.call_duration_seconds ? esc(r.call_duration_seconds) + 's' : '—'}</b></div>
            </div>
            ${profilingRow}

            ${flags.map(f => `
            <div class="compliance-item">
                <div class="compliance-header">
                    <span class="type-badge ${typeClass(f.type)}">${esc(f.type)}</span>
                    <span class="severity-badge ${severityClass(f.severity)}">${esc(f.severity)}</span>
                </div>
                <p>${esc(f.description)}</p>
                <div class="excerpt-box">${esc(f.transcript_excerpt)}</div>
            </div>`).join('')}

            ${r.escalation_required
                ? `<div class="excerpt-box" style="border-left-color:#f56565;margin-top:12px;">
                       🚨 ${esc(r.escalation_reason||'Escalation required.')}
                   </div>`
                : ''}
        </div>
    </details>`;
}

/* ── wire up events ── */
$('runBtn').addEventListener('click', loadResults);
$('clearBtn').addEventListener('click', () => {
    $('agentName').value = '';
    $('dateFrom').value = '';
    $('dateTo').value = '';
    $('assessment').value = '';
    $('classification').value = '';
    loadResults();
});
/* Enter key in agent name triggers search */
$('agentName').addEventListener('keydown', e => { if (e.key === 'Enter') loadResults(); });

/* ── initial load (no filters) ── */
loadResults();
</script>
</body>
</html>
