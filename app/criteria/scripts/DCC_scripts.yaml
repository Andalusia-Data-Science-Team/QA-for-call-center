script_compliance:
  evaluation_criteria:
  - order: 1
    stage: Agent Greeting
    notes: السلام عليكم مع حضرتك  ...... من مجموعة أندلسية صحة اتشرف باسم حضرتك للترحيب
    script: السلام عليكم مع حضرتك  ...... من مجموعة أندلسية صحة اتشرف باسم حضرتك للترحيب
  - order: 2
    stage: Agent welcoming the customer after customer response
    notes: الترحيب بالعميل بعد معرفة اسمه وفى حالة عدم توضيح الاسم يتم الترحيب  باستخدام حضرتك بدل الاسم
    script: '................ أهلا وسهلاً أستاذ'
  - order: 3
    stage: IF the customer sent his inquiry before
    notes: فى حالة توضيح العميل لاستفساره قبل بدء المحادثة يتم الاجابة على استفسارة  الموضح اعلى المحادثة مباشرة وعدم سؤاله عنه مرة آخرى
    script: أهلا وسهلاً أستاذ .... / يا فندم لحظات وسيتم الرد على حضرتك بالتفاصيل
  - order: 4
    stage: inquiry about customer request
    notes: فى حالة عدم وضوح استفسار العميل  يتم السؤال عنه وعرض المساعده
    script: أقدر اساعد  حضرتك  ازاى
  - order: 5
    stage: If Customer inquiry about services / offers / Doctor
    notes: يتم التوضيح بالعرض أو الخدمة أو الطبيب  وعرض الحجز على العميل
    script: العرض / الخدمة / الطبيب/ آلخ  .....................، تحب احجزلك موعد امتى
  - order: 6
    stage: If Customer Need Booking / Accept The Offer
    script: من فضلك، ممكن توضحلي رقم الهوية / الأقامة الخاص بحضرتك والموعد المطلوب كشفية جديدة أم مراجعة
  - order: 7
    stage: If Customer Need Booking / Accept The Offer
    notes: في حالة وجود أكثر من ملف علي نفس رقم الهوية بنفس البيانات (رقم موبايل و أسم العميل) يجب الحجز علي آخر ملف مسجل به زيارات للعميل مع التأكيد علي رقم الموبايل المسجل علي الملف. واستكمال اى نقص بها
      في جميع حالات الحجز و إعادة الجدولة
    script: رقم الموبايل حضرتك المسجل على الملف هو نفس الرقم اللي بتكلمني منه تمام ؟
  - order: 8
    stage: If Customer Need Booking / Accept The Offer
    notes: في حالة وجود أكثر من ملف علي نفس رقم الهوية بنفس البيانات (رقم موبايل و أسم العميل) يجب الحجز علي آخر ملف مسجل به زيارات للعميل مع التأكيد علي رقم الموبايل المسجل علي الملف. واستكمال اى نقص بها
      في جميع حالات الحجز و إعادة الجدولة
    script: 'لو العميل بيكلمنا من رقم مختلف عن المسجل علي الملف: الرقم المسجل على الملف آخره (بنوضح آخر 3 أرقام فقط) تمام؟'
  - order: 9
    stage: If Customer Need Booking / Accept The Offer
    notes: في حالة وجود أكثر من ملف علي نفس رقم الهوية بنفس البيانات (رقم موبايل و أسم العميل) يجب الحجز علي آخر ملف مسجل به زيارات للعميل مع التأكيد علي رقم الموبايل المسجل علي الملف. واستكمال اى نقص بها
      في جميع حالات الحجز و إعادة الجدولة
    script: 'وفي هذه الحالة اذا اكد العميل ان الرقم صحيح يجب إبلاغ العميل بالآتي: أحب اوضحلك أن مجموعة أندلسية بتعتمد على رقم الهاتف المسجل بالملف للتواصل مع حضرتك.'
  - order: 10
    stage: If Customer Need Booking / Accept The Offer
    notes: في حالة وجود أكثر من ملف علي نفس رقم الهوية بأسماء مختلفة ولكنها تابعة لنفس العائلة يجب الأستفسار عن رقم الهوية الصحيح وتسجيلة بالملف وفي حالة توضيح العميل ان رقم الهوية الاخر غير متاح في الوقت
      الحالي يجب ازالة رقم الهوية الخاطئ من الملف مع توجيه العميل لتجهزيه والاتصال بنا مره اخرى في اي وقت للتحديث، واستكمال المكالمة بشكل طبيعي، مع التأكيد علي رقم الموبايل المسجل علي الملف. واستكمال اى
      نقص به في جميع حالات الحجز و إعادة الجدولة
    script: واضح امامي على قاعدة البيانات ان رقم هوية حضرتك مسجل على اكتر من ملف تابع للعائلة، ممكن توضحلي رقم الهوية الموضح تابع لأي شخص، مع توضيح هوية صاحب الملف الآخر لتحديث البيانات.
  - order: 11
    stage: If Customer Need Booking / Accept The Offer
    notes: في حالة وجود أكثر من ملف علي نفس رقم الهوية بأسماء مختلفة ولكنها تابعة لنفس العائلة يجب الأستفسار عن رقم الهوية الصحيح وتسجيلة بالملف وفي حالة توضيح العميل ان رقم الهوية الاخر غير متاح في الوقت
      الحالي يجب ازالة رقم الهوية الخاطئ من الملف مع توجيه العميل لتجهزيه والاتصال بنا مره اخرى في اي وقت للتحديث، واستكمال المكالمة بشكل طبيعي، مع التأكيد علي رقم الموبايل المسجل علي الملف. واستكمال اى
      نقص به في جميع حالات الحجز و إعادة الجدولة
    script: 'في حالة توضيح العميل ان رقم الهوية الاخر غير متاح في الوقت الحالي: تمام، برجاء تجهيز الرقم والتواصل معنا في أي وقت مناسب لحضرتك لتحديث البيانات.'
  - order: 12
    stage: If Customer Need Booking / Accept The Offer
    notes: في حال عدم العثور على ملف للعميل بعد البحث باستخدام رقم الهوية أو رقم الإقامة، يُرجى البحث باستخدام رقم الهاتف المحمول. وإذا لم يتم العثور على ملف أيضًا، يمكن إنشاء ملف جديد للعميل.
    script: استأذن حضرتك توضحلي ( الاسم رباعي -  الجنس " يتم وضعة بناء علي الاسم " - رقم الهوية او الاقامه "تم الاستفسار عنه مسبقا"  - العمر - رقم الهاتف - الجنسية - مكان الاقامة أو الحي السكني - رقم الواتساب
      ) (يجب مراجعة البيانات المطلوبة حسب كل فرع)
  - order: 13
    stage: If Customer reject booking
    notes: فى حالة رفض العميل الحجز يتم سؤاله عن سبب رفض الحجز
    script: فى سبب معين لعدم الحجز اقدر اساعد حضرتك فيه؟
  - order: 14
    stage: If Customer reject booking
    notes: فى حالة رفض العميل الحجز ووجود عرض  بخصوص الخدمة المستفسر عنها  يتم التوضيح بالعرض المتاح
    script: حضرتك فى عرض مميز على خدمة ...... اللى حضرتك كنت  مهتم بهاالعرض ده عباره عن ........
  - order: 15
    stage: Booking confirmation
    script: 'تم تاكيد الحجز لحضرتك بفرع ....... يوم ...... الساعة ....... مع الدكتور ...... استاذنك الحضور قبل الموعد ب 15 دقيقة لتنسيق الدخول مع الاستقبال  ملحوظة هامة: يتم التوضيح فى فرع المكرونة الحضور
      قبل الموعد ب 30 دقيقة لقياس العلامات الحيوية وتنسيق الدخول مع الاستقبال'
  - order: 16
    stage: After HC working hours
    notes: في حالة استفسار العميل عن الرعاية المنزلية خارج ساعات العمل
    script: (AR script) يسعدنا تحويل طلبكم إلى قسم الرعاية المنزلية. ونعتذر لإبلاغكم بأن القسم خارج مواعيد العمل حاليًا، وسيتم الرد على طلبكم بمجرد بدء ساعات العمل الرسمية، وذلك من الساعة 9:00 صباحًا حتى
      11:00 مساءً.  شكرا لتفهمكم (EN script) We will forward your request to the Home Care Department. We apologize as the department is currently outside its working hours. A member of the Home Care team
      will respond to your request during their official working hours, from *9:00 AM to 11:00 PM*. Thank you for your understanding.
  - order: 17
    stage: offering extra assistant
    script: أى استفسار آخر
  - order: 18
    stage: Closing
    script: شكرًا لتواصلكم مع مجموعة أندلسية صحة، نتمنى لكم دوام الصحة والعافية.
  - order: 19
    stage: Important note
    script: 'ملحوظة هامة جدا : يتم الالتزام بكافة الاسكريبتات المتفق عليها كتطبيق أندلسية صحة ورسالة تأكيد الموعد وانظمة التقسيط ...... الخ   يتم مراجعة كافة الاسكريبتات المطلوبة'
