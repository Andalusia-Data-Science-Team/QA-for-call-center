[unix_http_server]
file=/tmp/supervisor.sock
chmod=0700

[supervisord]
nodaemon=true
logfile=/tmp/supervisord.log
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid
childlogdir=/tmp

[supervisorctl]
serverurl=unix:///tmp/supervisor.sock

[program:api]
command=/opt/venv/bin/uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload --reload-dir /workspace/app --reload-include *.yaml --reload-include *.sql --reload-include *.html
directory=/workspace
autostart=true
autorestart=unexpected
startsecs=5
stopasgroup=true
stopwaitsecs=30
redirect_stderr=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0

[program:automation]
command=/opt/venv/bin/python -m app.automation.runner
directory=/workspace
autostart=true
autorestart=unexpected
startsecs=5
stopsignal=TERM
stopasgroup=true
stopwaitsecs=600
redirect_stderr=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
