x-qa-base: &qa-base
  build: .
  image: qa-system:dev
  working_dir: /workspace
  user: "${QA_DOCKER_UID:-1000}:${QA_DOCKER_GID:-1000}"
  init: true
  volumes:
    - type: bind
      source: .
      target: /workspace
    - type: bind
      source: /home/ai/.andalusia_crm_cache.bin
      target: /tmp/.andalusia_crm_cache.bin
      read_only: true
  environment:
    PYTHONDONTWRITEBYTECODE: "1"
    PYTHONUNBUFFERED: "1"
    HOME: /tmp
    TZ: Africa/Cairo
    WATCHFILES_FORCE_POLLING: "true"
    QA_AUTOMATION_ENABLED: "${QA_AUTOMATION_ENABLED:-true}"
    QA_AUTOMATION_START_DATE: "${QA_AUTOMATION_START_DATE:-2026-10-25}"
    QA_DAILY_TARGET: "${QA_DAILY_TARGET:-50}"
    MSAL_TOKEN_CACHE_PATH: /workspace/data/.andalusia_crm_cache.bin
    MSAL_TOKEN_CACHE_SEED_PATH: /tmp/.andalusia_crm_cache.bin
    CRM_ALLOW_INTERACTIVE: "0"
  restart: unless-stopped

services:
  api:
    <<: *qa-base
    ports:
      - "${QA_API_PORT:-8001}:8000"
